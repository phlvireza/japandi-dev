<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Open Graph image layout template for Japandi Dev">
  <title>Open Graph image layout template for Japandi Dev</title>
  <!--
    EDITABLE SOURCE for the social sharing image.

    The image actually referenced by the og:image / twitter:image meta tags is
    og-image.png (1200x630), which is generated from the real logo PNG. This SVG is
    the layout template you can open in a vector editor to art-direct a replacement.

    An SVG cannot be used as the og:image itself: social platforms do not render SVG
    previews. Always export to PNG at 1200x630. See README.
  -->
  <rect width="1200" height="630" fill="#F3E8D1"/>

  <!-- LOGO SLOT: drop assets/images/japandi-dev-logo.png in here, unmodified, filling this square. -->
  <rect x="120" y="207" width="216" height="216" rx="34" fill="#FCFAF4" stroke="#B66A42" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="228" y="308" text-anchor="middle" fill="#A0552F"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="700">LOGO SLOT</text>
  <text x="228" y="336" text-anchor="middle" fill="#6E6A60"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="15">japandi-dev-logo.png</text>

  <text x="400" y="290" fill="#2C2925"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="74" font-weight="600" letter-spacing="-1.5">Japandi Dev</text>
  <text x="400" y="348" fill="#4C6956"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30">Coding with simplicity and purpose.</text>

  <!-- circuit motif lifted from the logo -->
  <path d="M400 396 H612 V434" fill="none" stroke="#B66A42" stroke-width="4" stroke-linecap="round"/>
  <circle cx="612" cy="450" r="13" fill="#B66A42"/>
  <circle cx="400" cy="396" r="8" fill="#4C6956"/>
</svg>
