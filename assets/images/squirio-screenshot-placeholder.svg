<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="440" height="560" role="img" aria-label="Squirio screenshot placeholder">
  <title>Squirio screenshot placeholder</title>
  <!-- PLACEHOLDER ARTWORK. Replace this file with a real Squirio screenshot. See README. -->
  <rect x="2" y="2" width="436" height="556" rx="22" fill="#FCFAF4" stroke="#B66A42" stroke-width="2.5" stroke-dasharray="9 7"/>

  <!-- title row -->
  <rect x="36" y="44" width="120" height="12" rx="6" fill="#E6DAC4"/>
  <circle cx="392" cy="50" r="13" fill="#F3E8D1"/>

  <!-- balance card -->
  <rect x="36" y="84" width="368" height="112" rx="16" fill="#4C6956"/>
  <rect x="60" y="110" width="86" height="9" rx="4.5" fill="#F5EBD6" opacity="0.55"/>
  <rect x="60" y="134" width="164" height="20" rx="10" fill="#F5EBD6"/>
  <rect x="60" y="166" width="64" height="8" rx="4" fill="#F5EBD6" opacity="0.4"/>

  <!-- donut -->
  <circle cx="118" cy="286" r="46" fill="none" stroke="#E6DAC4" stroke-width="16"/>
  <circle cx="118" cy="286" r="46" fill="none" stroke="#4C6956" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="176 289" transform="rotate(-90 118 286)"/>
  <circle cx="118" cy="286" r="46" fill="none" stroke="#B66A42" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="58 289" transform="rotate(114 118 286)"/>

  <!-- legend -->
  <circle cx="216" cy="258" r="6" fill="#4C6956"/>
  <rect x="232" y="253" width="104" height="10" rx="5" fill="#E6DAC4"/>
  <circle cx="216" cy="288" r="6" fill="#B66A42"/>
  <rect x="232" y="283" width="78" height="10" rx="5" fill="#E6DAC4"/>
  <circle cx="216" cy="318" r="6" fill="#E6DAC4"/>
  <rect x="232" y="313" width="92" height="10" rx="5" fill="#E6DAC4"/>

  <!-- transaction rows -->
  <line x1="36" y1="368" x2="404" y2="368" stroke="#E0D5C0" stroke-width="1.5"/>
  <circle cx="56" cy="398" r="12" fill="#F3E8D1"/>
  <rect x="82" y="386" width="130" height="10" rx="5" fill="#E6DAC4"/>
  <rect x="82" y="404" width="76" height="8" rx="4" fill="#E6DAC4" opacity="0.6"/>
  <rect x="342" y="392" width="62" height="10" rx="5" fill="#E6DAC4"/>

  <circle cx="56" cy="446" r="12" fill="#F3E8D1"/>
  <rect x="82" y="434" width="158" height="10" rx="5" fill="#E6DAC4"/>
  <rect x="82" y="452" width="64" height="8" rx="4" fill="#E6DAC4" opacity="0.6"/>
  <rect x="352" y="440" width="52" height="10" rx="5" fill="#E6DAC4"/>

  <!-- unmistakable placeholder label -->
  <text x="220" y="516" text-anchor="middle" fill="#A0552F"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="700" letter-spacing="0.5">Screenshot placeholder</text>
  <text x="220" y="538" text-anchor="middle" fill="#6E6A60"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="13">Replace with a real Squirio screen</text>
</svg>
