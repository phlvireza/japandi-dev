name: ${JAPANDI_PROJECT:-japandi-dev}

services:
  web:
    build:
      context: .
    image: ${JAPANDI_IMAGE:-japandi-dev:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAPANDI_PORT:-8080}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
