name: Deploy to Biznet Gio

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

# A second push while a deploy is running cancels the first, so two syncs can
# never interleave and leave the document root in a mixed state.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to document root
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify generated site output
        run: |
          python build.py --check
          python -B -m unittest discover -s tests -v

      - name: Sync over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Explicit FTPS on the standard port. Plain `ftp` would send the
          # password in clear text across the public internet.
          protocol: ftps
          port: 21
          # `strict` rejects any connection whose certificate does not verify.
          # This is safe here ONLY because FTP_SERVER is the server's own
          # hostname (web6-cpn.neohosting.id), which is on the Let's Encrypt
          # certificate Pure-FTPd presents. Point FTP_SERVER at ftp.japandi.dev
          # or a bare IP instead and this will fail the handshake - the fix is
          # to go back to the hostname, not to downgrade this to `loose`.
          security: strict
          # The first three are the action's own defaults, re-stated because
          # specifying `exclude` at all replaces them. .htaccess is deliberately
          # NOT excluded - without it there is no 404 page, no security headers
          # and no clean URLs.
          # _src/ and build.py are inputs to Squirio's page, not site content.
          # projects/squirio/.htaccess already blocks them if they reach the
          # server; not uploading them is one fewer thing depending on that.
          # (Comments must stay outside the block scalar below - inside it a
          # "#" line is a literal exclude pattern, not a comment.)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
            **/.gitattributes
            **/_src/**
            **/build.py

      # The sync above updates the origin, but Cloudflare keeps serving whatever it
      # already cached until its own TTL expires. Skipping this is how a fixed
      # stylesheet once sat live-on-origin but unreachable behind a stale edge copy
      # for a full day. Runs AFTER the sync so the origin is already correct when
      # the edge is told to refetch.
      #
      # Fails the job loudly on error: `curl --fail-with-body` catches HTTP status,
      # and the grep catches Cloudflare's 200-with-"success":false responses. A
      # silent purge failure is the exact failure mode this step exists to prevent.
      #
      # CF_API_TOKEN needs one permission only - Zone > Cache Purge > Purge, scoped
      # to the japandi.dev zone. It cannot read or change DNS, settings or content.
      - name: Purge the Cloudflare cache
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee purge-result.json
          echo
          grep -q '"success":true' purge-result.json
