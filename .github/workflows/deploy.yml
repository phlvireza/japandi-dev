name: Deploy to Biznet Gio

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

# A second push while a deploy is running cancels the first, so two syncs can
# never interleave and leave the document root in a mixed state.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to document root
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Cache busting. styles.css and script.js live at fixed URLs and are edited in
      # place, so without this every deploy is a race against whatever TTL each cache
      # layer decided to apply - the browser's, Cloudflare's, an ISP's. Stamping the
      # commit SHA into the query string makes each deploy a NEW url, so a stale copy
      # is not merely unlikely, it is unreachable: nothing can serve you a file at a
      # url it has never seen. That is what lets .htaccess give CSS and JS a one-year
      # TTL again without the risk that TTL used to carry.
      #
      # Only the two asset attributes are rewritten. A broader sed would risk touching
      # the inline <script> in <head>, whose exact bytes are pinned by the CSP sha256
      # in .htaccess - one changed character there silently kills the mobile menu.
      # The greps below fail the job rather than deploy a half-stamped page.
      - name: Stamp the asset urls with the commit SHA
        run: |
          set -euo pipefail
          for f in index.html privacy.html 404.html; do
            sed -i \
              -e "s|\(href=\"/\?assets/css/styles\.css\)?v=dev|\1?v=${GITHUB_SHA}|g" \
              -e "s|\(src=\"/\?assets/js/script\.js\)?v=dev|\1?v=${GITHUB_SHA}|g" \
              "$f"
          done

          # Every placeholder must be gone, and the SHA must appear exactly twice per file.
          if grep -rn "?v=dev" index.html privacy.html 404.html; then
            echo "::error::a ?v=dev placeholder survived the rewrite" >&2
            exit 1
          fi
          for f in index.html privacy.html 404.html; do
            n=$(grep -c "?v=${GITHUB_SHA}" "$f" || true)
            if [ "$n" -ne 2 ]; then
              echo "::error::$f has $n stamped asset refs, expected 2" >&2
              exit 1
            fi
          done

          # The CSP-hashed inline script must be byte-identical to the committed copy.
          for f in index.html privacy.html 404.html; do
            if ! diff <(git show "HEAD:$f" | grep -v "?v=dev") <(grep -v "?v=${GITHUB_SHA}" "$f") >/dev/null; then
              echo "::error::$f changed outside the asset urls - refusing to deploy" >&2
              exit 1
            fi
          done

          grep -n "styles.css?v=\|script.js?v=" index.html privacy.html 404.html

      - name: Sync over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Explicit FTPS on the standard port. Plain `ftp` would send the
          # password in clear text across the public internet.
          protocol: ftps
          port: 21
          # `strict` rejects any connection whose certificate does not verify.
          # This is safe here ONLY because FTP_SERVER is the server's own
          # hostname (web6-cpn.neohosting.id), which is on the Let's Encrypt
          # certificate Pure-FTPd presents. Point FTP_SERVER at ftp.japandi.dev
          # or a bare IP instead and this will fail the handshake - the fix is
          # to go back to the hostname, not to downgrade this to `loose`.
          security: strict
          # The first three are the action's own defaults, re-stated because
          # specifying `exclude` at all replaces them. .htaccess is deliberately
          # NOT excluded - without it there is no 404 page, no security headers
          # and no clean URLs.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
            **/.gitattributes

      # The sync above updates the origin, but Cloudflare keeps serving whatever it
      # already cached until its own TTL expires. Skipping this is how a fixed
      # stylesheet once sat live-on-origin but unreachable behind a stale edge copy
      # for a full day. Runs AFTER the sync so the origin is already correct when
      # the edge is told to refetch.
      #
      # Fails the job loudly on error: `curl --fail-with-body` catches HTTP status,
      # and the grep catches Cloudflare's 200-with-"success":false responses. A
      # silent purge failure is the exact failure mode this step exists to prevent.
      #
      # CF_API_TOKEN needs one permission only - Zone > Cache Purge > Purge, scoped
      # to the japandi.dev zone. It cannot read or change DNS, settings or content.
      - name: Purge the Cloudflare cache
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee purge-result.json
          echo
          grep -q '"success":true' purge-result.json
