name: Deploy Japandi Dev

on:
  push:
    branches: [main, qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify generated site output
        run: |
          python3 -B build.py --check
          python3 -B -m unittest discover -s tests -q

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS CF_API_TOKEN CF_ZONE_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"

      - name: Verify deployment access
        run: |
          ssh -T \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts" \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" check

      - name: Deploy the verified commit
        run: |
          ssh -T \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" "deploy $GITHUB_REF_NAME $GITHUB_SHA"

      - name: Purge the Cloudflare cache
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --output "$RUNNER_TEMP/purge-result.json"

          python3 -c '
          import json, sys
          with open(sys.argv[1]) as response:
              result = json.load(response)
          if result.get("success") is not True:
              raise SystemExit("Cloudflare cache purge failed")
          print("Cloudflare cache purged")
          ' "$RUNNER_TEMP/purge-result.json"

      - name: Remove temporary SSH credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"
