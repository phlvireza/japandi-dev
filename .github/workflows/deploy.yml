# Push to main -> the site is synced to the Biznet Gio document root over FTPS.
#
# The action keeps a state file (.ftp-deploy-sync-state.json) in the document
# root and uploads only what actually changed, so a routine deploy moves a few
# kilobytes rather than the whole bundle.
#
# Every connection detail is a repository secret, never a literal in this file.
# The repository is private, but secrets are still the right place: they are
# masked in Actions logs, and a repository that goes public later must not turn
# into a credential leak. Set them under Settings -> Secrets and variables ->
# Actions -> New repository secret:
#
#   FTP_SERVER      web6-cpn.neohosting.id
#                   The server's own hostname, NOT ftp.japandi.dev. japandi.dev
#                   is proxied through Cloudflare, and Cloudflare does not proxy
#                   FTP - a proxied record would send the deploy to Cloudflare's
#                   edge, which has no FTP listener.
#   FTP_USERNAME    the full FTP username from cPanel -> FTP Accounts,
#                   including the @japandi.dev part
#   FTP_PASSWORD    that account's password
#   FTP_SERVER_DIR  public_html/          for a primary domain, or
#                   public_html/japandi.dev/   for an addon domain
#                   (the trailing slash is required)

name: Deploy to Biznet Gio

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

# A second push while a deploy is running cancels the first, so two syncs can
# never interleave and leave the document root in a mixed state.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to document root
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Sync over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Explicit FTPS on the standard port. Plain `ftp` would send the
          # password in clear text across the public internet.
          protocol: ftps
          port: 21
          # `strict` rejects any connection whose certificate does not verify.
          # This is safe here ONLY because FTP_SERVER is the server's own
          # hostname (web6-cpn.neohosting.id), which is on the Let's Encrypt
          # certificate Pure-FTPd presents. Point FTP_SERVER at ftp.japandi.dev
          # or a bare IP instead and this will fail the handshake - the fix is
          # to go back to the hostname, not to downgrade this to `loose`.
          security: strict
          # The first three are the action's own defaults, re-stated because
          # specifying `exclude` at all replaces them. .htaccess is deliberately
          # NOT excluded - without it there is no 404 page, no security headers
          # and no clean URLs.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
            **/.gitattributes
